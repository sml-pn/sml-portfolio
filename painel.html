<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SML Developer - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background:#0a0f1e; font-family:'Courier New',monospace; }
        .glass { background:rgba(255,255,255,0.03); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); }
        input,select{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); color:white; border-radius:12px; padding:14px 18px; width:100%; min-height:48px; }
        .btn-neon{ background:linear-gradient(90deg,#00ffff,#ff00ff); color:#0a0f1e; font-weight:bold; border-radius:12px; padding:14px; width:100%; cursor:pointer; border:none; font-size:16px; min-height:48px; }
        .tag{ display:inline-flex; align-items:center; justify-content:center; padding:8px 16px; background:rgba(0,255,255,0.08); border-radius:20px; font-size:13px; cursor:pointer; margin:3px; border:1px solid transparent; min-height:40px; }
        .tag.selecionada{ background:#00ffff; color:#0a0f1e; font-weight:bold; border-color:#00ffff; }
        .btn-action{ padding:10px 14px; border-radius:10px; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); cursor:pointer; }
        .btn-action.editar{ color:#00ffff; }
        .btn-action.excluir{ color:#ff4080; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="tela-login" class="glass rounded-2xl p-10 w-full max-w-md">
        <h1 class="text-4xl font-bold bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent text-center">&lt;SML/&gt;</h1>
        <p class="text-gray-500 text-center mt-2">Painel do Desenvolvedor</p>
        <input type="password" id="senha" placeholder="Digite sua senha..." class="text-center text-lg mt-6" onkeypress="if(event.key==='Enter')login()">
        <button onclick="login()" class="btn-neon mt-4">🔐 Acessar Painel</button>
        <p id="erro-login" class="text-red-400 text-center mt-4 hidden">Senha incorreta!</p>
    </div>
    <div id="tela-painel" class="hidden w-full max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">&lt;SML/&gt; Painel</h1>
            <button onclick="logout()" class="text-gray-400 hover:text-red-400 px-4 py-2 rounded-lg border border-gray-700">Sair</button>
        </div>
        <div class="glass rounded-2xl p-6 md:p-8 mb-8">
            <h2 class="text-xl font-bold text-white mb-6">➕ Novo Projeto</h2>
            <div class="space-y-4">
                <input type="text" id="titulo" placeholder="Nome do projeto">
                <select id="categoria"><option value="">Categoria...</option><option value="Saúde">🏥 Saúde</option><option value="Automotivo">🚗 Automotivo</option><option value="Ecommerce">🛒 Ecommerce</option><option value="Pet Shop">🐾 Pet Shop</option><option value="Restaurante">🍽️ Restaurante</option></select>
                <input type="text" id="descricao" placeholder="Descrição curta">
                <input type="text" id="tecnologias" placeholder="React, Node.js, PostgreSQL">
                <input type="url" id="link" placeholder="https://...">
                <div class="flex flex-wrap gap-2" id="icones-tags">
                    <span class="tag selecionada" data-icone="box">📦 App</span><span class="tag" data-icone="cloud-cog">☁️ API</span><span class="tag" data-icone="shopping-cart">🛒 Loja</span>
                </div>
                <button onclick="salvarProjeto()" class="btn-neon">💾 Salvar Projeto</button>
                <p id="msg-sucesso" class="text-green-400 text-center hidden">✅ Projeto salvo!</p>
                <p id="msg-erro" class="text-red-400 text-center hidden"></p>
            </div>
        </div>
        <div class="glass rounded-2xl p-6 md:p-8">
            <h2 class="text-xl font-bold text-white mb-4">📁 Projetos Cadastrados</h2>
            <div id="lista-projetos"><p class="text-gray-500">Carregando...</p></div>
        </div>
    </div>
    <script>
        const SENHA = 'sml2025';
        const API_URL = 'https://sml-api.onrender.com';
        let iconeAtual = 'box';
        function login() {
            if (document.getElementById('senha').value === SENHA) {
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('tela-painel').classList.remove('hidden');
                carregarProjetos();
            } else document.getElementById('erro-login').classList.remove('hidden');
        }
        function logout() { document.getElementById('tela-login').classList.remove('hidden'); document.getElementById('tela-painel').classList.add('hidden'); }
        async function carregarProjetos() {
            const lista = document.getElementById('lista-projetos');
            lista.innerHTML = '<p class="text-gray-500">⏳ Conectando a '+API_URL+'...</p>';
            try {
                const res = await fetch(API_URL+'/api/projetos');
                if (!res.ok) throw new Error('Status '+res.status);
                const projetos = await res.json();
                if (!Array.isArray(projetos) || projetos.length===0) {
                    lista.innerHTML = '<p class="text-gray-500">📭 Nenhum projeto</p>';
                    return;
                }
                lista.innerHTML = projetos.map(p => `<div class="flex justify-between items-center bg-white/5 rounded-xl p-4"><div><p class="text-white font-bold">${p.titulo}</p><p class="text-gray-500 text-xs">${p.categoria||''}</p></div><div class="flex gap-2"><button onclick="editarProjeto(${p.id})" class="btn-action editar">✏️</button><button onclick="excluirProjeto(${p.id})" class="btn-action excluir">🗑️</button></div></div>`).join('');
            } catch(e) {
                lista.innerHTML = '<p class="text-red-400">❌ Erro: '+e.message+'<br><small>Verifique se a API está online em '+API_URL+'</small></p>';
            }
        }
        async function salvarProjeto() {
            const projeto = { icone:iconeAtual, titulo:document.getElementById('titulo').value, categoria:document.getElementById('categoria').value, descricao:document.getElementById('descricao').value, tecnologias:document.getElementById('tecnologias').value, link:document.getElementById('link').value, gradient:'from-neon to-neon-pink', bgTag:'bg-neon/20', tipo:'icone', imagem_url:'' };
            if (!projeto.titulo) { alert('Preencha o nome!'); return; }
            try {
                const res = await fetch(API_URL+'/api/projetos', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(projeto) });
                if (!res.ok) throw new Error('Status '+res.status);
                document.getElementById('msg-sucesso').classList.remove('hidden');
                setTimeout(()=>document.getElementById('msg-sucesso').classList.add('hidden'),3000);
                document.getElementById('titulo').value=''; document.getElementById('categoria').value='';
                carregarProjetos();
            } catch(e) {
                document.getElementById('msg-erro').innerText = '❌ '+e.message;
                document.getElementById('msg-erro').classList.remove('hidden');
            }
        }
        async function excluirProjeto(id) {
            if (!confirm('Excluir?')) return;
            try {
                await fetch(API_URL+'/api/projetos/'+id, { method:'DELETE' });
                carregarProjetos();
            } catch(e) { alert('Erro ao excluir: '+e.message); }
        }
        async function editarProjeto(id) {
            try {
                const res = await fetch(API_URL+'/api/projetos/'+id);
                const p = await res.json();
                document.getElementById('titulo').value = p.titulo||'';
                document.getElementById('categoria').value = p.categoria||'';
                document.getElementById('descricao').value = p.descricao||'';
                document.getElementById('tecnologias').value = p.tecnologias||'';
                document.getElementById('link').value = p.link||'';
                window.scrollTo({top:0,behavior:'smooth'});
                alert('Projeto carregado no formulário. Faça as alterações e clique em Salvar.');
            } catch(e) { alert('Erro ao editar: '+e.message); }
        }
        document.addEventListener('DOMContentLoaded',()=>{
            document.getElementById('icones-tags').addEventListener('click', e=>{
                const tag = e.target.closest('.tag');
                if (!tag||!tag.dataset.icone) return;
                document.querySelectorAll('#icones-tags .tag').forEach(t=>t.classList.remove('selecionada'));
                tag.classList.add('selecionada');
                iconeAtual = tag.dataset.icone;
            });
        });
    </script>
</body>
</html>
