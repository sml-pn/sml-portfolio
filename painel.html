<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SML Developer - Painel</title>
    <style>
        body { background:#0a0f1e; font-family:'Courier New',monospace; color:white; padding:20px; }
        .glass { background:rgba(255,255,255,0.05); border-radius:16px; padding:24px; margin:12px 0; }
        input,select { background:rgba(255,255,255,0.1); border:1px solid #333; color:white; padding:12px; border-radius:8px; width:100%; margin:6px 0; }
        button { background:#00ffff; color:#000; font-weight:bold; padding:12px 24px; border:none; border-radius:8px; cursor:pointer; width:100%; margin:6px 0; }
        .erro { color:#ff4444; }
        .sucesso { color:#44ff44; }
    </style>
</head>
<body>
    <div class="glass">
        <h2>🔍 Diagnóstico de Conexão</h2>
        <button onclick="testarAPI()">🔄 Testar https://sml-api.onrender.com/api/test-cors</button>
        <pre id="resultado-teste" style="background:#111;padding:12px;border-radius:8px;margin-top:12px;overflow-x:auto;"></pre>
        
        <h3 style="margin-top:20px;">📁 Projetos</h3>
        <button onclick="carregarProjetos()">📋 Listar Projetos</button>
        <pre id="resultado-projetos" style="background:#111;padding:12px;border-radius:8px;margin-top:12px;overflow-x:auto;"></pre>
    </div>

    <script>
        const API = 'https://sml-api.onrender.com';

        async function testarAPI() {
            const out = document.getElementById('resultado-teste');
            out.textContent = '⏳ Testando...';
            try {
                const res = await fetch(API+'/api/test-cors');
                const data = await res.json();
                out.innerHTML = '<span class="sucesso">✅ SUCESSO!</span>\n' + JSON.stringify(data, null, 2);
            } catch(e) {
                out.innerHTML = '<span class="erro">❌ FALHOU</span>\n' + e.message + '\n\nPossíveis causas:\n- API offline\n- CORS bloqueado\n- Rede do celular restrita';
            }
        }

        async function carregarProjetos() {
            const out = document.getElementById('resultado-projetos');
            out.textContent = '⏳ Carregando...';
            try {
                const res = await fetch(API+'/api/projetos');
                const data = await res.json();
                out.innerHTML = '<span class="sucesso">✅ ' + data.length + ' projeto(s)</span>\n' + JSON.stringify(data, null, 2);
            } catch(e) {
                out.innerHTML = '<span class="erro">❌ ERRO</span>\n' + e.message;
            }
        }
    </script>
</body>
</html>
