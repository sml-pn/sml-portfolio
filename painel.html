<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SML Developer - Painel Teste</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0f1e; color: white; font-family: monospace; padding: 20px; }
        button { background: #00ffff; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; margin: 10px 0; }
        .error { color: #ff4444; }
        .success { color: #44ff44; }
    </style>
</head>
<body>
    <h1 style="background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">&lt;SML/&gt; Painel de Teste</h1>
    <p>API: <code>https://sml-api.onrender.com</code></p>
    <button onclick="testarAPI()">🔄 Testar Conexão com API</button>
    <button onclick="carregarProjetos()">📋 Carregar Projetos</button>
    <div id="resultado" style="margin-top:20px;"></div>
    <script>
        const API_URL = 'https://sml-api.onrender.com';
        window.testarAPI = async function() {
            const div = document.getElementById('resultado');
            div.innerHTML = '⏳ Testando...';
            try {
                const res = await fetch(API_URL + '/health');
                const text = await res.text();
                div.innerHTML = `<span class="success">✅ Health: ${text}</span>`;
            } catch(e) {
                div.innerHTML = `<span class="error">❌ ${e.message}</span>`;
            }
        };
        window.carregarProjetos = async function() {
            const div = document.getElementById('resultado');
            div.innerHTML = '⏳ Carregando...';
            try {
                const res = await fetch(API_URL + '/api/projetos');
                if (!res.ok) throw new Error('Status ' + res.status);
                const projetos = await res.json();
                if (projetos.length === 0) {
                    div.innerHTML = '📭 Nenhum projeto';
                } else {
                    div.innerHTML = projetos.map(p => `<div class="card"><strong>${p.titulo}</strong><br><small>${p.categoria || ''}</small></div>`).join('');
                }
            } catch(e) {
                div.innerHTML = `<span class="error">❌ ${e.message}</span>`;
            }
        };
    </script>
</body>
</html>
