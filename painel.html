<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SML Developer - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0f1e; font-family: 'Courier New', monospace; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input, textarea, select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 12px; padding: 14px 18px; width: 100%; }
        input:focus, textarea:focus, select:focus { border-color: #00ffff; outline: none; box-shadow: 0 0 15px rgba(0,255,255,0.15); }
        label { color: #9ca3af; font-size: 13px; margin-bottom: 6px; display: block; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .btn-neon { background: linear-gradient(90deg, #00ffff, #ff00ff); color: #0a0f1e; font-weight: bold; border-radius: 12px; padding: 14px; width: 100%; cursor: pointer; border: none; font-size: 16px; }
        .btn-neon:hover { transform: scale(1.01); box-shadow: 0 0 30px rgba(0,255,255,0.3); }
        .tag { display: inline-block; padding: 7px 16px; background: rgba(0,255,255,0.08); border-radius: 20px; font-size: 12px; cursor: pointer; margin: 3px; border: 1px solid transparent; }
        .tag:hover { background: rgba(0,255,255,0.15); border-color: rgba(0,255,255,0.3); }
        .tag.selecionada { background: #00ffff; color: #0a0f1e; font-weight: bold; border-color: #00ffff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="tela-login" class="glass rounded-2xl p-10 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">&lt;SML/&gt;</h1>
            <p class="text-gray-500 mt-2">Painel do Desenvolvedor</p>
        </div>
        <input type="password" id="senha" placeholder="Digite sua senha..." class="text-center text-lg" onkeypress="if(event.key==='Enter')login()">
        <button onclick="login()" class="btn-neon mt-4">🔐 Acessar Painel</button>
        <p id="erro-login" class="text-red-400 text-center mt-4 hidden">Senha incorreta!</p>
    </div>

    <div id="tela-painel" class="hidden w-full max-w-2xl">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">&lt;SML/&gt; Painel</h1>
                <p class="text-gray-500 text-sm mt-1">Gerencie seus projetos</p>
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-red-400 transition px-4 py-2 rounded-lg border border-gray-700">Sair</button>
        </div>

        <div class="glass rounded-2xl p-6 md:p-8 mb-8">
            <h2 class="text-xl font-bold text-white mb-6">➕ Novo Projeto</h2>
            <div class="space-y-4">
                <div>
                    <label>📛 Nome</label>
                    <input type="text" id="titulo" placeholder="Nome do projeto">
                </div>
                <div>
                    <label>🏷️ Categoria</label>
                    <select id="categoria">
                        <option value="">Selecione...</option>
                        <option value="Saúde">🏥 Saúde</option>
                        <option value="Automotivo">🚗 Automotivo</option>
                        <option value="Ecommerce">🛒 Ecommerce</option>
                        <option value="Financeiro">💰 Financeiro</option>
                        <option value="Educação">📚 Educação</option>
                        <option value="Delivery">🛵 Delivery</option>
                        <option value="Imobiliário">🏠 Imobiliário</option>
                        <option value="Tecnologia">💻 Tecnologia</option>
                        <option value="Marketing">📢 Marketing</option>
                        <option value="Landing Page">📄 Landing Page</option>
                    </select>
                </div>
                <div>
                    <label>📝 Descrição</label>
                    <input type="text" id="descricao" placeholder="Uma frase sobre o projeto">
                </div>
                <div>
                    <label>🛠️ Tecnologias</label>
                    <input type="text" id="tecnologias" placeholder="React, Node.js, PostgreSQL">
                </div>
                <div>
                    <label>🔗 Link</label>
                    <input type="url" id="link" placeholder="https://...">
                </div>
                <div>
                    <label>🎨 Ícone</label>
                    <div class="flex flex-wrap gap-2" id="icones-tags">
                        <span class="tag selecionada" data-icone="box">📦 App</span>
                        <span class="tag" data-icone="cloud-cog">☁️ API</span>
                        <span class="tag" data-icone="shopping-cart">🛒 Loja</span>
                        <span class="tag" data-icone="smartphone">📱 Mobile</span>
                        <span class="tag" data-icone="monitor">🖥️ Site</span>
                        <span class="tag" data-icone="globe">🌐 Web</span>
                        <span class="tag" data-icone="code-2">💻 Código</span>
                    </div>
                </div>
                <div>
                    <label>🌈 Cor do Card</label>
                    <div class="flex flex-wrap gap-2" id="gradiente-tags">
                        <span class="tag selecionada" data-gradient="from-neon to-neon-pink" data-bgtag="bg-neon/20" style="background:linear-gradient(90deg,#00ffff,#ff00ff);color:#000;">Ciano → Rosa</span>
                        <span class="tag" data-gradient="from-neon-pink to-neon-purple" data-bgtag="bg-neon-pink/20" style="background:linear-gradient(90deg,#ff00ff,#8b5cf6);color:#fff;">Rosa → Roxo</span>
                        <span class="tag" data-gradient="from-neon-purple to-neon" data-bgtag="bg-neon-purple/20" style="background:linear-gradient(90deg,#8b5cf6,#00ffff);color:#fff;">Roxo → Ciano</span>
                    </div>
                </div>
                <button onclick="salvarProjeto()" class="btn-neon text-lg">💾 Salvar Projeto</button>
                <p id="msg-sucesso" class="text-green-400 text-center hidden">✅ Projeto salvo! <a href="/" class="underline">Ver no site</a></p>
            </div>
        </div>

        <div class="glass rounded-2xl p-6 md:p-8">
            <h2 class="text-xl font-bold text-white mb-4">📁 Projetos Cadastrados</h2>
            <div id="lista-projetos" class="space-y-3"><p class="text-gray-500">Carregando...</p></div>
        </div>
    </div>

    <script>
        const SENHA = 'sml2025';
        const API_URL = "";

        let iconeAtual = 'box';
        let gradientAtual = 'from-neon to-neon-pink';
        let bgTagAtual = 'bg-neon/20';
        let tipoMidia = 'icone';

        function login() {
            if (document.getElementById('senha').value === SENHA) {
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('tela-painel').classList.remove('hidden');
                carregarProjetos();
            } else {
                document.getElementById('erro-login').classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('tela-painel').classList.add('hidden');
            document.getElementById('senha').value = '';
        }

        // Eventos tags
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('icones-tags').addEventListener('click', e => {
                if (e.target.dataset.icone) {
                    document.querySelectorAll('#icones-tags .tag').forEach(t => t.classList.remove('selecionada'));
                    e.target.classList.add('selecionada');
                    iconeAtual = e.target.dataset.icone;
                }
            });
            document.getElementById('gradiente-tags').addEventListener('click', e => {
                if (e.target.dataset.gradient) {
                    document.querySelectorAll('#gradiente-tags .tag').forEach(t => t.classList.remove('selecionada'));
                    e.target.classList.add('selecionada');
                    gradientAtual = e.target.dataset.gradient;
                    bgTagAtual = e.target.dataset.bgtag;
                }
            });
        });
