<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Projetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:#0a0f1e;font-family:'Courier New',monospace;color:#fff;padding:20px}
        .glass{background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;margin:12px 0}
        .btn-action{padding:10px 14px;border-radius:10px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.03)}
        .btn-action.editar{color:#00ffff}
        .btn-action.excluir{color:#ff4080}
        .erro{color:#ff4444}
        .sucesso{color:#44ff44}
    </style>
</head>
<body>
    <h1 style="background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px">🧪 Teste de Projetos (API direta)</h1>
    <button onclick="carregar()" style="background:linear-gradient(90deg,#00ffff,#ff00ff);color:#0a0f1e;font-weight:bold;border-radius:12px;padding:14px 24px;border:none;cursor:pointer;font-size:16px;margin-bottom:20px">📋 Carregar Projetos</button>
    <div id="projetos" class="space-y-4"></div>
    <p id="mensagem" class="erro" style="margin-top:15px"></p>

    <script>
        const API_URL = 'https://sml-api.onrender.com';

        async function carregar() {
            const div = document.getElementById('projetos');
            const msg = document.getElementById('mensagem');
            div.innerHTML = '<p class="text-gray-500">⏳ Carregando...</p>';
            msg.innerHTML = '';
            try {
                const res = await fetch(`${API_URL}/api/projetos`);
                if (!res.ok) throw new Error('Status ' + res.status + ' - ' + await res.text());
                const projetos = await res.json();
                if (!Array.isArray(projetos) || projetos.length === 0) {
                    div.innerHTML = '<p class="text-gray-500">📭 Nenhum projeto encontrado</p>';
                    return;
                }
                div.innerHTML = projetos.map(p => `
                    <div class="glass flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="text-xl flex-shrink-0">📦</span>
                            <div class="min-w-0 flex-1">
                                <p class="text-white font-bold text-sm truncate max-w-[180px] sm:max-w-[300px]">${p.titulo || 'Sem título'}</p>
                                <p class="text-gray-500 text-xs truncate max-w-[180px] sm:max-w-[300px]">${(p.tecnologias || '').split(',').slice(0,3).join(', ') || 'Sem tecnologias'}</p>
                                ${p.categoria ? `<span class="inline-block ml-2 px-2 py-0.5 bg-cyan-500/20 text-cyan-400 rounded text-xs">${p.categoria}</span>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 self-end sm:self-auto">
                            <button onclick="alert('Editar projeto #${p.id}')" class="btn-action editar">✏️</button>
                            <button onclick="alert('Excluir projeto #${p.id}')" class="btn-action excluir">🗑️</button>
                        </div>
                    </div>
                `).join('');
                msg.innerHTML = '<span class="sucesso">✅ ' + projetos.length + ' projeto(s) carregado(s) com sucesso!</span>';
            } catch(e) {
                div.innerHTML = '';
                msg.innerHTML = '<span class="erro">❌ ' + e.message + '</span>';
                console.error(e);
            }
        }
    </script>
</body>
</html>
