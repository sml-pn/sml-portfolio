<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Projetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:#0a0f1e;font-family:monospace;color:#fff;padding:20px}
        button{background:linear-gradient(90deg,#00ffff,#ff00ff);color:#000;font-weight:bold;padding:14px;border:none;border-radius:8px;cursor:pointer;margin:5px}
        .card{background:rgba(255,255,255,0.05);border-radius:12px;padding:15px;margin:10px 0}
    </style>
</head>
<body>
    <h1 style="background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🧪 Teste de Projetos</h1>
    <button onclick="carregar()">📋 Carregar Projetos</button>
    <div id="resultado" style="margin-top:20px"></div>
    <script>
        async function carregar() {
            const r = document.getElementById('resultado');
            r.innerHTML = '⏳ Carregando...';
            try {
                const res = await fetch('https://sml-api.onrender.com/api/projetos');
                if (!res.ok) throw new Error('Status ' + res.status);
                const projetos = await res.json();
                if (!Array.isArray(projetos) || projetos.length === 0) {
                    r.innerHTML = '📭 Nenhum projeto encontrado';
                    return;
                }
                r.innerHTML = '<span style="color:lime">✅ ' + projetos.length + ' projeto(s)</span><br><br>' +
                    projetos.map(p => `<div class="card"><b>${p.titulo||'Sem título'}</b><br><small>${p.categoria||''} | ${Array.isArray(p.tecnologias)?p.tecnologias.join(', '):(p.tecnologias||'')}</small></div>`).join('');
            } catch(e) {
                r.innerHTML = '<span style="color:red">❌ ' + e.message + '</span>';
            }
        }
    </script>
</body>
</html>
