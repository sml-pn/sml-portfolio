<!DOCTYPE html><html><body>
<h1>Teste do Motor de Busca</h1>
<div id="servicos">
  <div class="service-card"><h3>Vitrine Bio</h3><p>Bio para Instagram a partir de R$97</p></div>
  <div class="service-card"><h3>Landing Pages</h3><p>Páginas de conversão R$550</p></div>
</div>
<div id="result"></div>
<script src="assets/js/search-engine.js"></script>
<script>
setTimeout(function() {
  var tests = ['modelos de bio', 'preço', 'landing', 'oi', 'showcase'];
  var html = '';
  tests.forEach(function(t) {
    var r = SMLEngine.search(t);
    html += '<h3>Pergunta: "' + t + '"</h3>';
    html += '<p>' + (r ? r.substring(0, 150) + '...' : '❌ NÃO ENCONTROU') + '</p><hr>';
  });
  document.getElementById('result').innerHTML = html;
}, 1000);
</script>
</body></html>
